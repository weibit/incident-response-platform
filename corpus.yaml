# Every indexed source. `service` scopes retrieval; `service: null` is global and
# eligible for every incident, which is why a non-markdown source must say so explicitly
# rather than leaving the key out.
sources:
  - path: docs/runbooks/*.md
    kind: runbook
    loader: markdown
  # Written explicitly rather than omitted: `null` declares global scope on purpose, and
  # the manifest rejects a generic source that says nothing at all.
  - path: docs/architecture/*.md
    kind: architecture
    loader: generic
    service: null
