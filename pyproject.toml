[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "incident-response-platform"
version = "0.1.0"
description = "Durable event-driven incident response starter"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "langgraph>=1,<2", "langchain>=1,<2",
  "langchain-openai>=1,<2", "langchain-text-splitters>=1,<2", "pypdf>=6,<7",
  "langgraph-checkpoint-postgres>=3,<4", "langfuse>=3,<4",
  "psycopg[binary,pool]>=3.2,<4", "aiokafka>=0.12,<1", "structlog>=25,<27",
  "mcp>=2,<3",
]
[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1,<2"]
embeddings = ["langchain-voyageai>=0.4,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/incident_platform"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL or Docker Compose"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
