name: incident-response-starter
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://incident:incident@postgres:5432/incident
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.2
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  init:
    <<: *app
    restart: "no"
    command:
      ["sh", "-c",
       "python -m incident_platform.bootstrap && python -m incident_platform.knowledge.index"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
  gateway:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
  runbooks:
    <<: *app
    command: ["python", "-m", "incident_platform.knowledge.server"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8080),2)"]
      interval: 10s
      timeout: 5s
      retries: 6
  stub-model:
    <<: *app
    command:
      ["uvicorn", "incident_platform.devtools.stub_model:app",
       "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  litellm-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes: ["litellmdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  litellm:
    image: ghcr.io/berriai/litellm:v1.90.2
    command: ["--config", "/app/proxy_server_config.yaml", "--port", "4000"]
    volumes: ["./deploy/litellm/config.yaml:/app/proxy_server_config.yaml:ro"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-dev-litellm}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-dev-litellm-salt}
      DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The gateway authenticates itself to the runbooks server; it does not relay a
      # per-caller credential, because it connects before any caller exists.
      KNOWLEDGE_MCP_TOKEN: ${KNOWLEDGE_MCP_TOKEN:-dev-knowledge}
    depends_on:
      litellm-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      runbooks: {condition: service_healthy}
      stub-model: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    <<: *app
    command: ["python", "-m", "incident_platform.worker.main"]
    depends_on:
      init: {condition: service_completed_successfully}
      litellm: {condition: service_healthy}
volumes:
  pgdata:
  kafkadata:
  litellmdata:
